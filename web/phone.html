<!doctype html>
<!-- MotionX phone: build a character, pick a place in the city, then follow the story and confirm the result. Talks to Python through bridge.js. -->
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MotionX</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2234;--muted:#76697F;--acc:#7B2FF7;--acc2:#b48cff;--gold:#E9B44C;--card:#FFFCF7;--line:#EADFF2;--good:#2F9E5B;--bad:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Tajawal','Geeza Pro',sans-serif;color:var(--ink);background:#120c2c}
body{background:linear-gradient(180deg,#0f1433 0%,#2a1d55 55%,#4b2d6e 100%);min-height:100vh}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 14px 28px;direction:rtl}
#app.en{direction:ltr}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{font-family:'Reem Kufi',serif;font-weight:700;font-size:1.35rem;color:#fff;direction:ltr}.brand span{color:var(--acc2)}
.lang{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 10px;font:inherit;font-weight:800;font-size:.85rem}
.card{background:var(--card);border-radius:22px;padding:18px 16px;box-shadow:0 14px 34px rgba(10,5,30,.35)}
h1{font-family:'Reem Kufi',serif;font-size:1.5rem;margin:2px 0 4px}
.sub{color:var(--muted);font-size:.98rem;margin:0 0 12px;line-height:1.55}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}.steps i{width:30px;height:5px;border-radius:5px;background:var(--line)}.steps i.on{background:var(--acc)}
.avatar{display:flex;justify-content:center;margin:2px 0 6px}
.avatar svg{filter:drop-shadow(0 6px 10px rgba(40,20,80,.25))}
.stage{border-radius:18px;background:radial-gradient(ellipse at 50% 85%,#efe7ff 0%,#fffcf7 65%);padding:6px 0 2px;margin-bottom:10px;position:relative;overflow:hidden}
label.l{display:block;font-weight:900;font-size:.95rem;margin:12px 0 7px}
input.name{width:100%;font:inherit;font-size:1.25rem;font-weight:800;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;text-align:center}
input.name:focus{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:16px;padding:6px 4px 8px;text-align:center;font:inherit;font-weight:800;font-size:.9rem;color:var(--ink)}
.tile.sel{border-color:var(--acc);background:#f4edff;box-shadow:0 0 0 3px rgba(123,47,247,.15)}
.tile svg{display:block;margin:0 auto 2px}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #d9cde6;padding:0}
.sw button.sel{box-shadow:0 0 0 3px var(--acc)}
.places{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.place{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 8px;text-align:center;font:inherit;color:var(--ink)}
.place.sel{border-color:var(--acc);background:#f4edff;box-shadow:0 0 0 3px rgba(123,47,247,.15)}
.place b{display:block;font-size:.98rem;margin-top:4px}.place small{color:var(--muted);font-weight:700;font-size:.85rem}
.row{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;border:0;border-radius:15px;padding:14px 10px;font:inherit;font-weight:900;font-size:1.08rem;background:#efe8f7;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 8px 18px rgba(123,47,247,.35)}
.btn.g{background:var(--good);color:#fff}.btn.r{background:#fff;border:2px solid #e8c9c5;color:var(--bad)}
.btn:disabled{opacity:.45}
.msg{font-size:1.18rem;line-height:1.65;text-align:center;margin:6px 0 2px}
.msg b{color:var(--acc)}
.big{font-family:'Reem Kufi',serif;font-size:1.65rem;margin:4px 0;text-align:center}
.pill{display:inline-block;background:#f4edff;color:var(--acc);border-radius:999px;padding:5px 12px;font-weight:900;font-size:.95rem}
.center{text-align:center}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin-top:10px}
@keyframes quake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-7px,3px) rotate(-1.2deg)}50%{transform:translate(6px,-4px) rotate(1.2deg)}75%{transform:translate(-4px,-2px) rotate(-.6deg)}100%{transform:translate(0,0)}}
body.quake #app{animation:quake .13s infinite}
body.storm{background:linear-gradient(180deg,#2b2430 0%,#5a4a3a 60%,#8a6a4a 100%)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@keyframes scan{0%{top:6%}100%{top:88%}}
.scanline{position:absolute;left:8%;right:8%;height:4px;border-radius:4px;background:#6fd3ff;box-shadow:0 0 18px #6fd3ff;animation:scan 1.2s ease-in-out infinite alternate}
.spark{position:absolute;color:#ffd23f;font-size:20px;animation:pop .6s ease-out}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin:0 3px;animation:pop 1s infinite alternate}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
</style></head>
<body><canvas id="snow"></canvas><div id="app"></div>

  let st=L.style, out=L.outfit||'casual', hair=L.hair, skin=L.skin, shirt=L.shirt, hat=L.hat||'none'; if(st==='cap'){ st='short'; hat='cap'; }

  let glass=''; if(L.glasses==='sun') glass=[-1,1].map(k=>`<rect x="${fx+k*ex-fr*0.2}" y="${ey-fr*0.14}" width="${fr*0.4}" height="${fr*0.27}" rx="${fr*0.1}" fill="#16151c"/>`).join('')+`<line x1="${fx-ex+fr*0.2}" y1="${ey-fr*0.05}" x2="${fx+ex-fr*0.2}" y2="${ey-fr*0.05}" stroke="#16151c" stroke-width="1.2"/>`;

function wire(){

  on('go',()=>{ if(S.editing){ S.sent=send('update',{look:S.look,act:S.act}); S.editing=false; S.step=0; ARGS.me=Object.assign({},ARGS.me,{look:Object.assign({},S.look),act:S.act}); }

  on('fix',()=>{ S.fixedLocal=true; send('fix',{fixed:true}); sparkle(); render(); });
  on('mess',()=>{ S.fixedLocal=false; send('fix',{fixed:false}); render(); });
  on('yes',()=>{ S.answered=true; send('confirm',{ok:true}); sparkle(); buzz([60,40,60]); render(); });
  on('no',()=>{ S.answered=false; send('confirm',{ok:false}); render(); });
}
function sparkle(){ setTimeout(()=>{ const st=document.querySelector('.stage'); if(!st) return; for(let k=0;k<10;k++){ const s=document.createElement('div'); s.className='spark'; s.textContent='✦'; s.style.left=(10+Math.random()*80)+'%'; s.style.top=(10+Math.random()*70)+'%'; st.appendChild(s); setTimeout(()=>s.remove(),900); } },30); }
function buzz(p){ try{ const n=navigator; if(n.vibrate) n.vibrate(p); }catch(e){} try{ const n=window.parent.navigator; if(n&&n.vibrate) n.vibrate(p); }catch(e){} }
function stormFx(on){ document.body.classList.toggle('storm',on); if(on){ document.body.classList.add('quake'); buzz([500,120,400,120,900,150,600]); clearTimeout(S.qt); S.qt=setTimeout(()=>document.body.classList.remove('quake'),2600); } else document.body.classList.remove('quake'); }
function fitHeight(){ if(window.streamlitHeight) requestAnimationFrame(()=>streamlitHeight(Math.max(document.documentElement.scrollHeight, 640)+10)); }
// ------------------------------------------------------------------ data from Python
window.onStreamlitArgs=a=>{
  const prevAct=ARGS.act, wasJoined=ARGS.joined; ARGS=Object.assign({},ARGS,a);
  if(ARGS.me){ if(ARGS.me.fixed===S.fixedLocal) S.fixedLocal=null; if(ARGS.me.confirmed===S.answered) S.answered=null; }
  if(ARGS.act!==prevAct){ stormFx(ARGS.act===2); if(ARGS.act!==3&&ARGS.act!==4) S.fixedLocal=null; if(ARGS.act<5) S.answered=null; if(ARGS.act>1) S.editing=false; }
  if(a.full){ S.sent=null; }
  if(a.error && S.sent && S.sent.type==='join'){ S.sent=null; alert(LANG==='ar'?'المدينة امتلت!':'The city is full!'); }
  const key=JSON.stringify([ARGS.joined,ARGS.act,ARGS.me,ARGS.pred]), building=!ARGS.joined||S.editing;
  if(key!==S.lastKey && !(building && ARGS.joined===wasJoined)) render();
  S.lastKey=key;
};

(function(){ const c=$('snow'), g=c.getContext('2d'); let F=[]; const rs=()=>{ c.width=innerWidth; c.height=innerHeight; F=Array.from({length:60},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2+0.6,v:Math.random()*0.5+0.25})); }; rs(); addEventListener('resize',rs);
  (function t(){ g.clearRect(0,0,c.width,c.height); g.fillStyle='rgba(255,255,255,.75)'; F.forEach(f=>{ f.y+=f.v; f.x+=Math.sin(f.y/40)*0.3; if(f.y>c.height){ f.y=-4; f.x=Math.random()*c.width; } g.beginPath(); g.arc(f.x,f.y,f.r,0,7); g.fill(); }); requestAnimationFrame(t); })(); })();
