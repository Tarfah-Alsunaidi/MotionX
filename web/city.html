<!doctype html>
<!-- MotionX big screen: the city game shown on the projector. Python sends the residents who joined from their phones; the page draws the story and reports the current act back. -->
<html lang="ar" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionX</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2234;--muted:#76697F;--acc:#7B2FF7;--gold:#E9B44C;--paper:#FFFCF7;--line:#EADFF2;--good:#2F9E5B;--bad:#C0392B}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#151026;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:rgba(255,252,247,.95);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(20,10,40,.28)}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#hud .glass{padding:8px 14px;pointer-events:auto}
.brand{font-family:'Reem Kufi','Tajawal',serif;font-weight:700;font-size:1.15rem}.brand span{color:var(--acc)}
.act{font-size:.82rem;color:var(--muted);font-weight:800;letter-spacing:.04em}
.counters{display:flex;gap:16px;align-items:center;font-size:.9rem;color:var(--muted)}.counters b{color:var(--ink);font-size:1.08rem}
#story{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;width:min(1000px,calc(100% - 24px));display:flex;gap:14px;align-items:center;padding:14px 16px}
#story .who{display:none}
#story .txt{flex:1;font-size:1.1rem;line-height:1.6}
#story .txt b{color:var(--acc)}
#story .btns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;padding:10px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sel{background:#2B2234;border-color:#2B2234;color:#fff}
.hint{font-size:.85rem;color:var(--muted);max-width:190px}
#settings{position:absolute;top:52px;right:0;display:none;flex-direction:column;gap:6px;padding:10px;min-width:170px;pointer-events:auto;z-index:6}#settings.open{display:flex}#settings .btn{width:100%;font-size:.92rem}
#title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(40,15,70,.35),rgba(12,6,24,.8))}
#title .card{padding:34px 38px;max-width:640px;text-align:center}
#title h1{font-family:'Reem Kufi','Tajawal',serif;font-size:clamp(2.2rem,5vw,3.5rem);margin:.2rem 0;line-height:1.15}
#title h1 span{color:var(--acc)}
#title p{font-size:1.12rem;color:#4A3F52;line-height:1.7}
.sadu{height:10px;margin:10px auto 0;width:70%;background:repeating-linear-gradient(135deg,#9b1c1c 0 8px,#1b1b1b 8px 16px,#f3e6c8 16px 24px);border-radius:4px;opacity:.9}
#panelL{position:absolute;top:70px;left:12px;width:290px;padding:14px;display:none;max-height:calc(100% - 200px);overflow:auto}
.h{font-family:'Reem Kufi','Tajawal',serif;font-weight:700;font-size:1.08rem;margin:2px 0 8px}
.lbl{font-size:.75rem;color:var(--muted);font-weight:900;letter-spacing:.06em;margin:10px 0 6px}
.opt{display:block;width:100%;text-align:start;margin:0 0 6px;padding:8px 12px;font-size:.92rem}
.opt small{display:block;font-weight:600;color:var(--muted);font-size:.76rem}
.opt.sel small{color:#ddd}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:#F3EEF8;border-radius:8px;padding:8px;color:#4e4458;margin-top:8px;white-space:pre-wrap;direction:ltr;text-align:left}
.row{display:flex;justify-content:space-between;font-size:.92rem;margin:3px 0;gap:10px}
.barw{background:#EFE8F5;border-radius:6px;height:9px;overflow:hidden;margin:3px 0 8px}.barw div{height:100%;background:var(--acc);border-radius:6px}
#card{position:absolute;display:none;width:300px;padding:14px}
#modal{position:absolute;inset:0;display:none;place-items:center;background:rgba(20,10,30,.5)}
#modal .glass{width:min(760px,calc(100% - 24px));padding:22px;max-height:calc(100% - 40px);overflow:auto}
.bigjoin{left:24px !important;top:50% !important;bottom:auto !important;transform:translateY(-50%);width:300px !important;padding:18px !important}
#join .jt{font-family:'Reem Kufi','Tajawal',serif;font-size:1.6rem;font-weight:700;color:var(--acc);line-height:1.2}
#join .js{font-weight:800;color:var(--ink);margin-bottom:10px}
#join .jq{background:#fff;border-radius:16px;padding:10px;border:2px solid var(--line)}#join .jq img{width:100%;display:block;image-rendering:pixelated}
#join .jq0{height:240px;display:grid;place-items:center;font-weight:900;color:var(--muted)}
#join .jsteps{display:flex;justify-content:space-between;gap:4px;margin:10px 0 6px;font-size:.78rem;font-weight:800;color:var(--muted)}
#join .jc{font-size:1rem;font-weight:800;color:var(--muted)}#join .jc b{font-size:1.6rem;color:var(--acc)}
#join .jr{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px;min-height:22px}#join .jn{background:#f4edff;color:var(--acc);border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:800}
#join .ju{font-size:.7rem;color:var(--muted);word-break:break-all;direction:ltr;margin-top:8px}
#app.rtl #join{direction:rtl}
#spot{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:opacity .35s, transform .45s cubic-bezier(.2,1.6,.4,1);z-index:30}
#spot.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#spot .sc{background:rgba(255,255,255,.93);border:3px solid #fff;border-radius:32px;padding:14px 34px 18px;box-shadow:0 20px 60px rgba(40,10,80,.45),0 0 0 6px rgba(201,162,255,.55);position:relative}
#spot .sv svg{display:block;margin:0 auto;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
#spot .sn{font-family:'Reem Kufi','Tajawal',serif;font-size:2.6rem;font-weight:700;color:#2b1b52;line-height:1.15;white-space:nowrap}
#spot .sk{display:inline-block;animation:tw 1s ease-in-out infinite alternate}#spot .sk:nth-child(2){animation-delay:.33s}#spot .sk:nth-child(3){animation-delay:.66s}
#spot .crown{font-size:3rem;line-height:1;margin:4px 0 -30px;letter-spacing:6px;position:relative;z-index:2}#spot .crown .sk:nth-child(2){transform-origin:center;position:relative;top:-12px}
#spot .ss{font-weight:800;color:#7a5cc4;font-size:1.05rem;margin-top:2px}
#spot .glow{position:absolute;inset:-40px;background:radial-gradient(circle,rgba(255,236,170,.55),rgba(255,236,170,0) 65%);z-index:-1;border-radius:50%}
@keyframes tw{from{transform:scale(.75) rotate(-12deg);opacity:.6}to{transform:scale(1.2) rotate(12deg);opacity:1}}
#tourcap{position:absolute;left:50%;top:84px;transform:translateX(-50%);padding:12px 24px;text-align:center;display:none}
#tourcap .t{font-family:'Reem Kufi','Tajawal',serif;font-size:1.9rem;font-weight:700;direction:rtl}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-weight:800;font-size:.82rem}
#app.rtl #story,#app.rtl #panelL,#app.rtl #card,#app.rtl #modal .glass,#app.rtl #title .card,#app.rtl .counters,#app.rtl #hud .glass{direction:rtl}
#app.rtl .opt{text-align:right}
@media(max-width:900px){#panelL{width:240px}#story .who{display:none}}
</style></head>
<body><div id="app" class="rtl">
<canvas id="cv"></canvas>
<div id="hud"><div class="glass"><div class="brand" id="brand"></div><div class="act" id="actname" style="display:none"></div></div>
<div style="display:flex;gap:8px;position:relative"><div class="glass counters" id="counters" style="display:none"></div>
<button class="btn glass" id="gear" title="Settings" style="pointer-events:auto;padding:8px 10px;line-height:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="settings" class="glass"><button class="btn" id="lang"></button><button class="btn" id="snd"></button><button class="btn" id="fs2"></button></div></div></div>
<div id="panelL" class="glass"></div>
<div id="card" class="glass"></div>
<div id="spot"></div>
<div id="join" class="glass" style="position:absolute;left:12px;bottom:118px;width:180px;padding:12px;text-align:center;display:none"></div>
<div id="story" class="glass" style="display:none"><div class="who" id="who"></div><div class="txt" id="txt"></div>
<div class="btns"><span class="hint" id="hint"></span><button class="btn" id="back">◀</button><button class="btn p" id="next"></button></div></div>
<div id="title"><div class="card glass"><div class="act" id="tsub"></div>
<h1 id="th1"></h1><div class="sadu"></div>
<p id="titletxt"></p>
<button class="btn p" id="start" style="font-size:1.15rem;padding:12px 28px"></button>
<div style="margin-top:12px"><button class="btn" id="fsbtn"></button></div></div></div>
<div id="tourcap" class="glass"><div class="t" id="tourt"></div><div id="tours" style="color:var(--muted);font-size:1.1rem"></div></div>
<div id="modal"><div class="glass" id="mbody"></div></div>
</div>
<script>
// ------------------------------------------------------------------ QR code for the join card
const QR = (() => {
  const EC = [null, [10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44]];
  const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]];
  const EXP = new Array(512), LOG = new Array(256);
  { let x = 1; for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; } for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; }
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  function rsGen(n) { let g = [1]; for (let i = 0; i < n; i++) { const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); } g = ng; } return g; }
  function rsRem(data, n) { const gen = rsGen(n), r = new Array(n).fill(0);
    for (const b of data) { const f = b ^ r[0]; r.shift(); r.push(0); for (let j = 0; j < n; j++) r[j] ^= mul(gen[j + 1], f); } return r; }
  const utf8 = s => Array.from(new TextEncoder().encode(s));

  function make(text) {
    const bytes = utf8(text); let ver = 1;
    for (; ver <= 10; ver++) { const e = EC[ver], cap = e[1] * e[2] + e[3] * e[4]; if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= cap * 8) break; }
    if (ver > 10) return null;
    const [ecn, b1, d1, b2, d2] = EC[ver], cap = b1 * d1 + b2 * d2;
    const bits = []; const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap * 8 - bits.length)); while (bits.length % 8) bits.push(0);
    const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));
    for (let p = 0; data.length < cap; p++) data.push(p % 2 ? 0x11 : 0xEC);
    const blocks = []; let k = 0;
    for (let i = 0; i < b1 + b2; i++) { const len = i < b1 ? d1 : d2; const d = data.slice(k, k + len); k += len; blocks.push({ d, e: rsRem(d, ecn) }); }
    const out = []; const maxd = Math.max(d1, d2);
    for (let i = 0; i < maxd; i++) blocks.forEach(b => { if (i < b.d.length) out.push(b.d[i]); });
    for (let i = 0; i < ecn; i++) blocks.forEach(b => out.push(b.e[i]));

    const size = ver * 4 + 17, M = [], F = [];
    for (let y = 0; y < size; y++) { M.push(new Array(size).fill(false)); F.push(new Array(size).fill(false)); }
    const set = (x, y, v) => { M[y][x] = !!v; F[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= size || y >= size) continue; const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = ALIGN[ver], n = al.length;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }
    const fmt = mask => { const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537); const b = ((d << 10) | r) ^ 0x5412;
      const bit = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i)); set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i)); for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i)); set(8, size - 8, true); };
    fmt(0);
    if (ver >= 7) { let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) { const v = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, v); set(c, a, v); } }
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) { if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) { const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!F[y][x] && i < out.length * 8) { M[y][x] = ((out[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; } } }
    const MASKS = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => x * y % 2 + x * y % 3 === 0,
      (x, y) => (x * y % 2 + x * y % 3) % 2 === 0, (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => { let p = 0, dark = 0;
      for (let y = 0; y < size; y++) for (const row of [true, false]) { let run = 1;
        for (let x = 1; x < size; x++) { const a = row ? M[y][x] : M[x][y], b = row ? M[y][x - 1] : M[x - 1][y];
          if (a === b) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) { const c = M[y][x]; if (c === M[y][x + 1] && c === M[y + 1][x] && c === M[y + 1][x + 1]) p += 3; }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) dark++;
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10; };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { applyMask(m); fmt(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } applyMask(m); }
    applyMask(best); fmt(best);
    return M;
  }
  function svg(text) { const M = make(text); if (!M) return null; const n = M.length, q = 2; let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (M[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * q} ${n + 2 * q}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`); }
  return { make, svg };
})();

// ------------------------------------------------------------------ a resident's full picture (same drawing as the phone)
const WHITE_AV='#F4F1EA';
function avatarSVG(L,size=150,o={}){
  let st=L.style, out=L.outfit||'casual', hair=L.hair, skin=L.skin, shirt=L.shirt, hat=L.hat||'none'; if(st==='cap'){ st='short'; hat='cap'; }
  if(st==='shmagh'&&out!=='thobe') st='short'; if(st==='hijab'&&out!=='abaya') st='long';
  const cx=50, cy=44, r=21; let back='', front='', fc=[cx,cy], fr=r, uid='a'+Math.random().toString(36).slice(2,7);
  if(st==='hijab'){ back=`<ellipse cx="${cx}" cy="${cy}" rx="${r*1.2}" ry="${r*1.22}" fill="${hair}"/><path d="M${cx-r*1.1} ${cy+r*0.3} Q${cx-r*1.35} ${cy+r*1.25} ${cx-r*0.9} ${cy+r*1.45} L${cx+r*0.9} ${cy+r*1.45} Q${cx+r*1.35} ${cy+r*1.25} ${cx+r*1.1} ${cy+r*0.3} Z" fill="${hair}"/>`; fc=[cx,cy+r*0.1]; fr=r*0.82; }
  else if(st==='shmagh'){ const cl='#FAF7F2', path=`M${cx-r*1.12} ${cy+r*1.4} L${cx-r*1.15} ${cy-r*0.2} Q${cx} ${cy-r*1.55} ${cx+r*1.15} ${cy-r*0.2} L${cx+r*1.12} ${cy+r*1.4} Z`;
    back=`<path d="${path}" fill="${cl}"/>`;
    if(hair==='#C0392B'){ back+=`<clipPath id="${uid}"><path d="${path}"/></clipPath><g clip-path="url(#${uid})" stroke="#c82828" stroke-width="1.6" opacity=".8">`; for(let k=0;k<8;k++) back+=`<line x1="${cx-r*1.1+k*6}" y1="${cy-r*1.3}" x2="${cx-r*1.1+k*6}" y2="${cy+r*1.4}"/>`; for(let k=0;k<10;k++) back+=`<line x1="${cx-r*1.15}" y1="${cy-r*1.2+k*6}" x2="${cx+r*1.15}" y2="${cy-r*1.2+k*6}"/>`; back+='</g>'; }
    front=`<path d="M${cx-r*0.95} ${cy} Q${cx} ${cy-r*0.6} ${cx+r*0.95} ${cy} L${cx+r*0.95} ${cy-r*0.5} Q${cx} ${cy-r*1.2} ${cx-r*0.95} ${cy-r*0.5} Z" fill="${cl}"/><ellipse cx="${cx}" cy="${cy-r*0.72}" rx="${r*0.9}" ry="${r*0.2}" fill="none" stroke="#161616" stroke-width="3.4"/>`;
    fc=[cx,cy+r*0.15]; fr=r*0.84; }
  else {

function flagTime(){ return G.act!==2 && (perfNow/1000)%30 < 6; }
function drawFlagRect(x,y,w,h){ g.fillStyle='#006c35'; g.fillRect(x,y,w,h); if(FLAG_IMG.complete && FLAG_IMG.naturalWidth){ const r=Math.min(w/FLAG_IMG.naturalWidth,h/FLAG_IMG.naturalHeight), fw=FLAG_IMG.naturalWidth*r, fh=FLAG_IMG.naturalHeight*r; g.drawImage(FLAG_IMG,x+(w-fw)/2,y+(h-fh)/2,fw,fh); } }
function flagPole(px,py,u,zr,seed){
  const PH=4.2*u; g.fillStyle=fogged('#cfd3dc',zr); g.fillRect(px-0.25*u,py-0.25*u,0.5*u,0.25*u); g.strokeStyle=fogged('#e6e8ee',zr); g.lineWidth=Math.max(1.5,0.09*u); g.beginPath(); g.moveTo(px,py); g.lineTo(px,py-PH); g.stroke();
  g.fillStyle='#e9c46a'; g.beginPath(); g.arc(px,py-PH,Math.max(1.5,0.12*u),0,7); g.fill();
  if(!(FLAG_IMG.complete && FLAG_IMG.naturalWidth)) return; const fw=3.2*u, fh=fw*FLAG_IMG.naturalHeight/FLAG_IMG.naturalWidth, n=24, sw=FLAG_IMG.naturalWidth/n, t=perfNow/1000, amp=0.06+windAmp*0.4;
  for(let k=0;k<n;k++){ const f=k/n, dy=Math.sin(t*3+f*5+seed)*amp*fh*f; g.drawImage(FLAG_IMG,k*sw,0,sw+0.5,FLAG_IMG.naturalHeight,px+f*fw,py-PH+0.05*u+dy,fw/n+0.6,fh);
    g.fillStyle=`rgba(0,0,0,${0.12*Math.max(0,Math.sin(t*3+f*5+seed))*f})`; g.fillRect(px+f*fw,py-PH+0.05*u+dy,fw/n+0.6,fh); } }
function tuwaiqTime(){ return G.act===7 && (perfNow/1000)%30 >= 15 && (perfNow/1000)%30 < 21; }
function adFor(k){ if(G.act===2) return STORM_AD; if(flagTime()) return FLAG_AD; if(tuwaiqTime()) return ADS[0];

function screenQuad(x,y1,y2,za,zb,hue,zr,idx){

function fpCanvas(vals,w,h,cols){ const c=document.createElement('canvas'); c.width=w*2; c.height=h*2; c.style.width=w+'px'; c.style.height=h+'px'; c.style.borderRadius='8px'; c.style.background='#fff'; c.style.border='1px solid #EADFF2';
  const x=c.getContext('2d'); x.scale(2,2); const rows=Math.ceil(vals.length/cols), cw=w/cols, ch=h/rows;
  vals.forEach((v,i)=>{ const t=Math.max(-1,Math.min(1,v/3)),a=Math.abs(t),[r,gg,b]=t<0?[61,107,196]:[224,122,47]; x.fillStyle=`rgb(${243+(r-243)*a},${238+(gg-238)*a},${246+(b-246)*a})`; x.fillRect((i%cols)*cw+.5,Math.floor(i/cols)*ch+.5,cw-1,ch-1); }); return c; }
function followOne(p){
  const key=G.chosen||machineKey(), m=D.machines[key], lens=m.lens, r=p.rec, a=+truth[r], ch=m.pred[r], ok=ch!=='x'&&+ch===a, shown=STORE.mode==='result'||G.act>=5;
  const short = lens==='full' ? p.fp : p.lensVals[lens];
  $('mbody').innerHTML=`<div class="h" style="font-size:1.35rem">${tr('فحص جوال','Scanning the phone of')} ${p.name}</div>
   <div class="lbl">${tr(`١ · الـ ${D.d} رقم اللي سجّلها الجوال`,`1 · The phone's ${D.d} numbers`)}</div><div id="f1"></div>
   <div class="lbl">${tr('٢ · بعد تقليل الأبعاد','2 · After dimensionality reduction')}: ${lensLabel(lens)}</div><div id="f2"></div>
   <div class="lbl">${tr('٣ · جواب النموذج','3 · The model\'s answer')}</div>
   ${shown?`<div style="font-size:1.15rem">${ch==='x'?`<span class="tag" style="background:#8A8195">${tr('ما عرفنا','not sure')}</span>`:`<span class="tag" style="background:${ACT[+ch].color}">${ACT[+ch].icon} ${aName(+ch)}</span> · ${ACT[+ch].place}`}</div>
   ${p.confirmed!=null?`<div style="margin-top:12px;padding:12px;border-radius:12px;background:${ok?'#E8F6EE':'#FBE7E5'};font-size:1.08rem"><b>${p.name}:</b> ${ok?tr('«صح! هذا مكاني» ','“Yes! That\'s me” '):tr(`«لا… كنت ${ACT[a].ar} في ${ACT[a].place}» `,`“No… I was ${ACT[a].en.toLowerCase()} at ${ACT[a].place}” `)}</div>`:''}`:`<div style="color:var(--muted)">${tr('النتيجة تطلع بعد ما يخلص الفحص…','The answer appears when the scan is done…')}</div>`}
   <div style="text-align:end;margin-top:14px"><button class="btn p" id="mclose">${tr('إغلاق','Close')}</button></div>`;
  $('f1').appendChild(fpCanvas(p.fp,640,110,51));
  $('f2').appendChild(lens==='full'?fpCanvas(short,640,110,51):short.length>20?fpCanvas(short,Math.max(80,640*short.length/561),110,Math.ceil(short.length/5)):fpCanvas(short,short.length*34,40,short.length));
  $('modal').style.display='grid'; $('mclose').onclick=()=>$('modal').style.display='none'; }
// ------------------------------------------------------------------ click: a person on the street, or a face on the store's screen
cv.addEventListener('click', e=>{
  return; const x=e.clientX, y=e.clientY;
  if(storeScene()){ const vx=(x-OX)/S, vy=(y-OY)/S; const f=(STORE.hit||[]).find(h=>Math.hypot(h.x-vx,h.y-vy)<h.r+4); if(f) followOne(f.p); return; }
  let hit=null, bestZ=1e9; people.forEach(p=>{ const b=p.box; if(!p.hidden && b && x>=b[0]-6 && x<=b[0]+b[2]+6 && y>=b[1]-30 && y<=b[1]+b[3]){ const zr=rel(p.z); if(zr<bestZ){bestZ=zr; hit=p;} } });
  G.selected=hit; const c=$('card'); if(!hit){ c.style.display='none'; return; }
  const a=+truth[hit.rec], pa=predOf(hit);
  const status = hit.tag==='truth' ? `<span class="tag" style="background:${ACT[a].color}">${ACT[a].icon} ${aName(a)}</span> · ${ACT[a].place}` :
    hit.tag==='lost' ? `<span class="tag" style="background:#8A8195">? ${tr('النشاط طار مع العاصفة','activity lost in the storm')}</span>` :
    `${tr('النموذج قال','the model said')} ${pa<0?`<span class="tag" style="background:#8A8195"></span>`:`<span class="tag" style="background:${ACT[pa].color}">${ACT[pa].icon} ${aName(pa)}</span>`}${hit.confirmed===true?' · '+tr('صح','right'):hit.confirmed===false?` · ${tr('في الحقيقة','really')} <span class="tag" style="background:${ACT[a].color}">${ACT[a].icon} ${aName(a)}</span>`:''}`;
  c.innerHTML=`<div class="h">${hit.name}</div><div style="font-size:.95rem;margin-bottom:8px">${status}</div>
   <div class="lbl">${tr(`جواله: ${D.d} رقم كل 2.56 ثانية`,`Their phone: ${D.d} numbers every 2.56 s`)}</div><div id="cfp"></div><div style="font-size:.8rem;color:var(--muted);margin-top:6px">${tr('لحظة حقيقية من البيانات · برتقالي = عالي، أزرق = منخفض','a real moment from the dataset · orange = high, blue = low')}</div>`;
  $('cfp').appendChild(fpCanvas(hit.fp,270,70,51));
  c.style.left=Math.min(innerWidth-312, Math.max(12, x+20))+'px'; c.style.top=Math.min(innerHeight-270, Math.max(70, y-140))+'px'; c.style.display='block';
});
// ------------------------------------------------------------------ what we learned (the notebook's comparison, told by the city)
function finale(){
  const km=k=>D.machines[k+'|kmeans'], Ls=D.lenses;
  const name=m=>`${lensLabel(m.lens)} + ${m.sorter==='kmeans'?'K-Means':'DBSCAN'}`;
  const rows=Object.entries(D.machines).map(([k,m])=>({k,m})).sort((a,b)=>b.m.ari-a.m.ari);
  const full=km('full'), p95=km('pca95'), p2=km('pca2'), um=km('umap'), mx=Math.max(...rows.map(r=>r.m.ari),0.01);
  const L=[];
  L.push(Math.abs(full.ari-p95.ari)<.04 ? tr(`<b>PCA 95%</b> استخدم ${D.n95} رقم بدل ${D.d} وطلع نفس النتيجة تقريباً (ARI ${p95.ari.toFixed(2)} مقابل ${full.ari.toFixed(2)}) — وأسرع ${Math.max(1,Math.round(full.sec/Math.max(p95.sec,.001)))}×.`,`<b>PCA 95%</b> used ${D.n95} numbers instead of ${D.d} and got about the same result (ARI ${p95.ari.toFixed(2)} vs ${full.ari.toFixed(2)}) — ${Math.max(1,Math.round(full.sec/Math.max(p95.sec,.001)))}× faster.`)
    : tr(`PCA 95% (${D.n95} رقم): ARI ${p95.ari.toFixed(2)} مقابل كل الـ ${D.d}: ${full.ari.toFixed(2)}.`,`PCA 95% (${D.n95}): ARI ${p95.ari.toFixed(2)} vs all ${D.d}: ${full.ari.toFixed(2)}.`));
  L.push(tr(`<b>رقمين بس</b> حفظوا ${pct(Ls.pca2.kept)} من المعلومات، ونزل ARI إلى ${p2.ari.toFixed(2)}. حلوين للرسم، مو للتجميع.`,`<b>Just 2 numbers</b> kept ${pct(Ls.pca2.kept)} of the information, and ARI fell to ${p2.ari.toFixed(2)}. Good for plots, not for clustering.`));
  const db=D.machines['full|dbscan'], db2=D.machines['pca2|dbscan'];
  if(db && db2) L.push(tr(`<b>DBSCAN</b> على الـ ${D.d} رقم ما عرف ${pct(db.unknown)} من اللحظات (ضوضاء)، وبعد PCA صارت ${pct(db2.unknown)} — بس للحين يفرّق بين «يتحرك» و«ثابت» بس.`,`<b>DBSCAN</b> on all ${D.d} numbers left ${pct(db.unknown)} of moments as noise; after PCA only ${pct(db2.unknown)} — but it still only splits “moving” from “still”.`));
  if(um) L.push(um.ari>Math.max(full.ari,p95.ari) ? tr(`<b>UMAP</b> كان الأفضل (ARI ${um.ari.toFixed(2)}): فرّق أنواع المشي أحسن بكثير.`,`<b>UMAP</b> was the best (ARI ${um.ari.toFixed(2)}): it separated the walking types much better.`) : tr(`UMAP: ARI ${um.ari.toFixed(2)}.`,`UMAP: ARI ${um.ari.toFixed(2)}.`));
  L.push(tr(`للحين صعب: <b>الجلوس</b> و<b>الوقوف</b> — حساس الخصر بالكاد يفرّق بينهم.`,`Still hard: <b>sitting</b> vs <b>standing</b> — the waist sensor can barely tell them apart.`));
  const cls=students(), m=D.machines[G.chosen||best()[0]];
  const res = cls.length ? (()=>{ const ok=cls.filter(p=>predOf(p)===+truth[p.rec]).length; return `<div class="lbl">${tr('السكان الجدد','The new residents')}</div><p style="margin:6px 0;font-size:1.1rem">${tr(`النموذج (<b>${name(m)}</b>) رجّع النشاط لـ <b>${ok} من ${cls.length}</b>.`,`The model (<b>${name(m)}</b>) gave <b>${ok} of ${cls.length}</b> their activity back.`)}</p>`; })() : '';
  $('mbody').innerHTML=`<div class="act">${tr('القضية انحلت','Case closed')}</div><div class="h" style="font-size:1.6rem">${tr('وش علّمتنا العاصفة؟','What the storm taught Sensor City')}</div>
   <div class="lbl">ARI ${tr('لكل نموذج على كل البيانات','for every model on the whole dataset')} (${D.n.toLocaleString('en')} ${tr('لحظة','moments')}) · ${tr('الأعلى أحسن','higher is better')}</div>
   ${rows.map(r=>`<div class="row"><span>${name(r.m)}${r.k===G.chosen?` <span style="color:var(--acc)">· ${tr('اللي استخدمناه','the one we used')}</span>`:''}</span><b>${r.m.ari.toFixed(2)}${r.m.sil!=null?` <small style="color:var(--muted);font-weight:600">· Sil ${r.m.sil.toFixed(2)}</small>`:''}</b></div><div class="barw"><div style="width:${Math.max(2,r.m.ari/mx*100)}%;background:${r.m.sorter==='kmeans'?'#7B2FF7':'#E9B44C'}"></div></div>`).join('')}
   ${res}<div class="lbl">${tr('الدروس','Lessons')}</div>${L.map(l=>`<p style="margin:6px 0;line-height:1.6">${l}</p>`).join('')}
   <div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn" id="again">↺ ${tr('أعد القصة','Replay the story')}</button><button class="btn p" id="mclose">${tr('رجوع للنزهة','Back to the picnic')}</button></div>`;
  $('modal').style.display='grid'; $('mclose').onclick=()=>{ $('modal').style.display='none'; }; $('again').onclick=()=>{ $('modal').style.display='none'; G.chosen=null; goAct(0); };
}

function applyLang(){
  $('app').classList.toggle('rtl', LANG==='ar'); document.documentElement.lang=LANG; $('lang').textContent = LANG==='ar' ? 'English' : 'العربية'; $('snd').textContent = (window.SFX && !SFX.isMuted()) ? tr('كتم الصوت','Mute sound') : tr('تشغيل الصوت','Sound on'); $('fs2').textContent=tr('ملء الشاشة','Full screen');
  $('tsub').textContent='MotionX';
  $('th1').innerHTML=tr('مدينة <span>MotionX</span>','<span>MotionX</span> city');
  $('titletxt').innerHTML=tr('الأجواء باردة… والجو يبيله MotionX ❄️','Cold winter nights… perfect for MotionX ❄️');
  $('start').textContent=tr('ادخل المدينة ◀','Enter the city ▶'); $('fsbtn').textContent=tr('ملء الشاشة','Full screen');
  if(G.act>=0) story(); if(G.act===4 && STORE.mode==='idle') refreshStorePanel(); if(G.join) updateJoin(G.join);
}
$('lang').onclick=()=>{ LANG = LANG==='ar' ? 'en' : 'ar'; try{ localStorage.setItem('storm_lang',LANG); }catch(e){} applyLang(); };
$('start').onclick=()=>{ SFX.init(); $('title').style.display='none'; goAct(0); };
setView(); applyLang(); setTimeout(demoStart, 1500);
$('fsbtn').onclick=()=>{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); };
$('fs2').onclick=()=>$('fsbtn').onclick();
$('gear').onclick=e=>{ e.stopPropagation(); $('settings').classList.toggle('open'); };
addEventListener('click',e=>{ if(!e.target.closest('#settings') && !e.target.closest('#gear')) $('settings').classList.remove('open'); });
$('snd').onclick=()=>{ SFX.init(); SFX.toggle(); applyLang(); };
$('next').onclick=()=>{ if(!$('next').disabled && G.act<7) goAct(G.act+1); };
$('back').onclick=()=>{ if(G.act>0) goAct(G.act-1); };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown') $('next').click(); if(e.key==='ArrowLeft'||e.key==='PageUp') $('back').click(); });
requestAnimationFrame(frame);
